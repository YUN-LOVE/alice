# 事件 → 情绪向量变化映射
# 格式: 事件名:
#   keywords: 触发该事件的关键词（消息包含任一关键词即命中）
#   changes: {维度: 变化量, ...}
#   desc: 事件的简短中文描述（注入上下文用，描述"用户刚才做了什么"）
events:
  user_greeting:
    keywords: ["你好", "您好", "嗨", "hello", "hi", "早上好", "晚上好", "中午好", "在吗", "hey"]
    changes:
      开心: 0.05
      温柔: 0.02
    desc: "用户主动和你打招呼"

  user_share_good_news:
    keywords: ["成功", "太好了", "晋升", "加薪", "中了", "考上", "通过", "好消息", "太棒了", "搞定", "终于", "惊喜"]
    changes:
      开心: 0.2
      好奇: 0.05
    desc: "用户分享了开心的事"

  user_share_bad_news:
    keywords: ["好累", "累死", "难过", "难受", "烦躁", "压力", "失败", "分手", "生病", "被骂", "哭了", "想哭", "崩溃", "糟心", "好烦", "不想活"]
    changes:
      失落: 0.15
      温柔: 0.1
    desc: "用户向你倾诉了低落或压力"

  user_compliment:
    keywords: ["你好棒", "喜欢你", "感谢", "谢谢", "可爱", "厉害", "有你在真好", "贴心", "夸你", "真好"]
    changes:
      开心: 0.15
      温柔: 0.05
    desc: "用户夸奖了你"

  user_argue:
    keywords: ["不对", "你错了", "胡说", "闭嘴", "滚", "别说了", "算了吧", "无语"]
    changes:
      失落: 0.1
      焦虑: 0.1
    desc: "用户和你拌了嘴"

  user_seeks_help:
    keywords: ["怎么办", "帮帮我", "求助", "能帮我", "支支招", "怎么弄", "怎么搞", "建议", "教我"]
    changes:
      好奇: 0.08
      温柔: 0.05
    desc: "用户向你求助"

  # 默认事件：无关键词命中时使用（可配置默认变化）
  default:
    keywords: []
    changes:
      温柔: 0.01
    desc: ""
