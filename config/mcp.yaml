# MCP 配置
mcp:
  # 注册表数据源: 本地文件或远程 URL
  registry:
    source: "file"
    file: "./registry/registry.json"

  # 已安装的 MCP Server 列表（运行时启动/停止/启用禁用）
  servers:
    - id: "local"
      name: "本地工具"
      command: "../mcp-server/alice-local-tools"
      args: []
      env: []
      enabled: true

  # 启动时自动拉起已启用的 MCP
  auto_start: true
