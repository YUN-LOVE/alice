# MCP 配置
mcp:
  # 注册表数据源: 本地文件或远程 URL
  registry:
    source: "file"
    file: "./registry/registry.json"

  # 已安装的 MCP Server 列表（运行时启动/停止/启用禁用）
  servers:
    - id: "local"
      name: "本地工具"
      command: "../mcp-server/alice-local-tools"
      args: []
      env: []
      enabled: true

    - id: "vision"
      name: "视觉"
      command: "../mcp-vision/alice-vision-tools"
      args: []
      env: []
      enabled: true

    # 搜索（Brave，需 BRAVE_API_KEY，免费 2000 次/月；key 用启动环境变量注入，不进配置文件）
    - id: "search"
      name: "搜索"
      command: "npx"
      args: ["-y", "@modelcontextprotocol/server-brave-search"]
      env: []
      enabled: true

    # 备用：DuckDuckGo 免费搜索（无需 key，但免费后端可能被反爬限流）
    # - id: "search-ddg"
    #   name: "搜索(DDG)"
    #   command: "npx"
    #   args: ["-y", "duckduckgo-mcp-server"]
    #   env: []
    #   enabled: false

  # 远程 MCP（HTTP/SSE 方式接入第三方 MCP Server）示例：
  # - id: "remote-search"
  #   name: "远程搜索"
  #   transport: "http"
  #   url: "https://mcp.example.com/search"
  #   headers:
  #     Authorization: "Bearer xxx"
  #   enabled: true

  # 启动时自动拉起已启用的 MCP
  auto_start: true
