# MCP 配置
mcp:
  # 注册表数据源: 本地文件或远程 URL
  registry:
    source: "file"
    file: "./registry/registry.json"

  # 已安装的 MCP Server 列表（运行时启动/停止/启用禁用）
  servers:
    - id: "local"
      name: "本地工具"
      command: "../mcp-server/alice-local-tools"
      args: []
      env: []
      enabled: true

    - id: "vision"
      name: "视觉"
      command: "../mcp-vision/alice-vision-tools"
      args: []
      env: []
      enabled: true

    # 搜索（Tavily：免费 1000 次/月，注册无需信用卡，仅邮箱）。
    # 无 TAVILY_API_KEY 时进入 keyless 模式（搜索可用）；配 key 更稳定。
    # 启动 shell 里 export TAVILY_API_KEY=tvly-xxx 注入
    - id: "search"
      name: "搜索"
      command: "pnpx"
      args: ["tavily-mcp"]
      env: []
      enabled: true

    # 语音合成（TTS）：回复完成后自动朗读（assistant_audio）。
    # 配 ALICE_TTS_API_KEY 走 OpenAI 兼容 TTS API（硅基流动 CosyVoice 等）；
    # 未配则用 Edge TTS 免费接口（无需 key，需访问微软网络）。
    # internal: true —— 工具不暴露给 LLM（音频数据不进 LLM 上下文），仅后端直接调用
    - id: "tts"
      name: "语音合成"
      command: "../mcp-tts/alice-tts"
      args: []
      env: []
      enabled: true
      internal: true

    # 语音识别（STT）：语音输入转文字。
    # 配 ALICE_STT_API_KEY 走 OpenAI 兼容 STT API（硅基流动 SenseVoice 等）；
    # 未配则尝试本地 whisper.cpp（ALICE_WHISPER_BIN / ALICE_WHISPER_MODEL）
    - id: "stt"
      name: "语音识别"
      command: "../mcp-stt/alice-stt"
      args: []
      env: []
      enabled: true
      internal: true

    # 备用：DuckDuckGo 免费搜索（无需任何 key/信用卡，但免费后端可能被反爬限流）
    # - id: "search-ddg"
    #   name: "搜索(DDG)"
    #   command: "npx"
    #   args: ["-y", "duckduckgo-mcp-server"]
    #   env: []
    #   enabled: false

    # Brave 官方搜索（免费额度但注册需信用卡验证，暂不用）
    # - id: "search-brave"
    #   name: "搜索(Brave)"
    #   command: "npx"
    #   args: ["-y", "@modelcontextprotocol/server-brave-search"]
    #   env: []
    #   enabled: false

  # 远程 MCP（HTTP/SSE 方式接入第三方 MCP Server）示例：
  # - id: "remote-search"
  #   name: "远程搜索"
  #   transport: "http"
  #   url: "https://mcp.example.com/search"
  #   headers:
  #     Authorization: "Bearer xxx"
  #   enabled: true

  # 启动时自动拉起已启用的 MCP
  auto_start: true

  # MCP Server 启动超时（秒）——npx 首次下载/启动可能较慢
  timeout_seconds: 90
