# Kernel 配置
llm:
    # OpenAI 兼容 API
    provider: "deepseek" # deepseek / openai / siliconflow / mock
    base_url: "https://api.deepseek.com/v1"
    api_key: "" # 留空则使用 mock 模式
    model: "deepseek-v4-flash"
    temperature: 0.8
    max_tokens: 2048
    stream: true
# 语音能力（TTS / STT，由 MCP 内部 Server 提供）
audio:
    tts_enabled: true # 回复完成后自动合成语音并推送 assistant_audio
    tts_voice: zh-CN-XiaoyiNeural
    tts_rate: +0%
    tts_pitch: +13Hz
    tts_volume: +0%
    stt_enabled: true # 语音输入转文字
    max_upload_mb: 20 # 文件分块上传大小上限（0 = 不限）
# 上下文
context:
    # Memory Block 最大条数（0 = 无限，阶段一暂未启用）
    max_messages: 200
